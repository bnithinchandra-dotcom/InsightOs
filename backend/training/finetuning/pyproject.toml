[project]
name = "insightos-training"
version = "0.1.0"
requires-python = "==3.11.18"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
